
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dropshare

  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5200MB
      file-size-threshold: 2MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sharedrop}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:sharedrop}
    password: ${DB_PASSWORD:sharedrop_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  web:
    resources:
      static-locations: file:../,classpath:/static/,classpath:/public/

# App Configuration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  upload:
    max-file-size: 5368709120
    max-files-per-share: 20
    max-text-size: 1048576
    storage-path: ${STORAGE_PATH:./uploads}
    allowed-extensions: jpg,jpeg,png,gif,bmp,svg,webp,ico,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,json,xml,yaml,yml,zip,rar,7z,tar,gz,bz2,mp3,mp4,avi,mov,mkv,wav,flac,ogg,js,ts,jsx,tsx,py,java,kt,go,rs,c,cpp,h,cs,rb,php,swift,sql,sh,bash,zsh,ps1,md,rst,log,conf,cfg,ini,env,toml,lock,woff,woff2,ttf,otf,eot

  otp:
    length: 6
    expiration-minutes: 10
    max-attempts: 5
    lockout-minutes: 15

  share:
    default-expiration: 24h
    max-downloads-default: 100

  cleanup:
    cron: "0 */15 * * * *"
    batch-size: 100

  security:
    rate-limit:
      max-requests-per-minute: 60
      max-upload-requests-per-minute: 10
      max-verify-requests-per-minute: 10

    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Logging
logging:
  level:
    root: INFO
    com.sharedrop: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
